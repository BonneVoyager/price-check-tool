# Publish the single-file build to GitHub Pages.
#
# `bun run build:single` emits dist/index.html with the JS bundle inlined, so
# the whole app is one request and needs no server-side anything.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs these; `id-token` is required by deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push cancel an in-flight deploy rather than queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # No runtime deps, but this installs @types/bun so `typecheck` is real.
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build:single
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
