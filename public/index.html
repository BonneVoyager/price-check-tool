<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OpenOcean v4 Playground</title>
<style>
/* ===========================================================================
   Design tokens. Dark is the primary theme; light is a full re-map rather than
   an afterthought. Nothing below hardcodes a colour.
   =========================================================================== */
:root {
  color-scheme: dark;
  --bg: #0a0c10;
  --bg-soft: #0e1117;
  --surface: #14181f;
  --surface-2: #1a1f28;
  --surface-3: #222834;
  --line: #242b36;
  --line-soft: #1b212a;
  --text: #e8edf5;
  --text-dim: #9aa6b8;
  --text-faint: #64707f;
  --accent: #4c8dff;
  --accent-dim: #1f3a63;
  --accent-glow: rgba(76, 141, 255, .13);
  --green: #3ddc84;
  --amber: #ffb454;
  --red: #ff5f56;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
  --r: 10px;
  --r-sm: 7px;
  --shadow: 0 16px 44px rgba(0, 0, 0, .55), 0 2px 6px rgba(0, 0, 0, .35);
}
@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --bg: #f7f8fa;
    --bg-soft: #ffffff;
    --surface: #ffffff;
    --surface-2: #f2f4f7;
    --surface-3: #e8ebf0;
    --line: #e0e4ea;
    --line-soft: #eef0f4;
    --text: #10151c;
    --text-dim: #5c6675;
    --text-faint: #8b95a3;
    --accent: #2f6fe0;
    --accent-dim: #cfe0ff;
    --accent-glow: rgba(47, 111, 224, .09);
    --green: #12a150;
    --amber: #b26a00;
    --red: #d92d20;
    --shadow: 0 12px 32px rgba(16, 21, 28, .12), 0 1px 3px rgba(16, 21, 28, .07);
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  padding: 40px 24px 80px;
  background:
    radial-gradient(1100px 520px at 18% -8%, var(--accent-glow), transparent 60%),
    var(--bg);
  color: var(--text);
  font: 14px/1.55 var(--sans);
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 940px; margin: 0 auto; }

/* --- header --------------------------------------------------------------- */
header { margin-bottom: 28px; }
.brand { display: flex; align-items: center; gap: 11px; margin-bottom: 12px; }
.mark {
  width: 30px; height: 30px; border-radius: 9px; flex: 0 0 30px;
  background: linear-gradient(145deg, var(--accent), #7d5cff);
  display: grid; place-items: center;
  box-shadow: 0 4px 14px rgba(76, 141, 255, .3);
}
h1 { font-size: 19px; font-weight: 650; margin: 0; letter-spacing: -.015em; }
.tag-v {
  font: 600 10px/1 var(--mono); color: var(--accent);
  border: 1px solid var(--accent-dim); background: var(--accent-glow);
  padding: 4px 7px; border-radius: 5px; letter-spacing: .04em;
}
.lede { color: var(--text-dim); font-size: 13.5px; max-width: 74ch; margin: 0; }
.lede code {
  font: 12px/1 var(--mono); background: var(--surface-2);
  border: 1px solid var(--line); padding: 2px 5px; border-radius: 4px;
  color: var(--text);
}
.lede strong { color: var(--text); font-weight: 600; }

/* --- card ---------------------------------------------------------------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 20px;
  margin-bottom: 16px;
}

/* --- form layout --------------------------------------------------------- */
.row { display: grid; gap: 14px; }
.row.swap { grid-template-columns: 1fr auto 1fr; align-items: end; }
.row.meta { grid-template-columns: repeat(3, 1fr); margin-top: 14px; }
@media (max-width: 700px) {
  .row.swap { grid-template-columns: 1fr; }
  .row.meta { grid-template-columns: 1fr 1fr; }
  .flip-wrap { justify-self: center; }
}

.field { min-width: 0; }
label {
  display: block; font-size: 10.5px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .07em;
  color: var(--text-faint); margin-bottom: 6px;
}

/* One shared control surface so every input and picker trigger matches. */
.control {
  width: 100%; height: 42px;
  display: flex; align-items: center; gap: 9px;
  padding: 0 11px;
  background: var(--bg-soft);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  color: var(--text);
  font: 14px/1 var(--sans);
  cursor: pointer;
  transition: border-color .12s, box-shadow .12s, background .12s;
  text-align: left;
}
.control:hover { border-color: var(--surface-3); background: var(--surface); }
.control:focus-visible, .control.active {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
input.control { cursor: text; font-family: var(--mono); font-size: 13.5px; }
input.control::placeholder { color: var(--text-faint); font-family: var(--sans); }

/* Picker trigger internals */
.tk { display: flex; align-items: center; gap: 9px; min-width: 0; flex: 1; }
.tk-ico {
  width: 21px; height: 21px; border-radius: 50%; flex: 0 0 21px;
  background: var(--surface-3); object-fit: cover;
  display: grid; place-items: center; overflow: hidden;
  font: 700 8.5px/1 var(--sans); color: var(--text-dim);
}
.tk-txt { min-width: 0; }
.tk-sym { display: block; font: 600 14px/1.2 var(--mono); letter-spacing: -.01em; }
.tk-sub {
  display: block; color: var(--text-faint); font: 11.5px/1.3 var(--sans);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.caret { flex: 0 0 auto; color: var(--text-faint); transition: transform .15s; }
.control.active .caret { transform: rotate(180deg); color: var(--accent); }

/* Flip button */
.flip {
  width: 34px; height: 34px; margin-bottom: 4px;
  display: grid; place-items: center;
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 9px; color: var(--text-dim); cursor: pointer;
  transition: color .14s, border-color .14s, background .14s, transform .2s;
}
.flip:hover {
  color: var(--accent); border-color: var(--accent-dim);
  background: var(--accent-glow); transform: rotate(180deg);
}

/* --- popover ------------------------------------------------------------- */
.pick { position: relative; }
.pop {
  position: absolute; z-index: 60; left: 0; right: 0; top: calc(100% + 6px);
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); box-shadow: var(--shadow);
  overflow: hidden; display: none;
}
.pop.open { display: block; animation: pop .13s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(-5px); } }
.pop-search {
  padding: 9px; border-bottom: 1px solid var(--line-soft);
  background: var(--surface-2);
}
.pop-search input {
  width: 100%; height: 34px; padding: 0 10px;
  background: var(--bg-soft); border: 1px solid var(--line);
  border-radius: var(--r-sm); color: var(--text);
  font: 13px/1 var(--sans); outline: none;
}
.pop-search input:focus { border-color: var(--accent); }
.pop-list { max-height: 292px; overflow-y: auto; scrollbar-width: thin; }
.pop-list::-webkit-scrollbar { width: 9px; }
.pop-list::-webkit-scrollbar-thumb {
  background: var(--surface-3); border-radius: 9px; border: 2px solid var(--surface);
}
.pop-group {
  font: 600 9.5px/1 var(--sans); text-transform: uppercase; letter-spacing: .08em;
  color: var(--text-faint); padding: 10px 12px 5px;
  position: sticky; top: 0; background: var(--surface);
}
.opt {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px; cursor: pointer; border-left: 2px solid transparent;
}
.opt:hover, .opt.on { background: var(--accent-glow); border-left-color: var(--accent); }
.opt.sel { background: var(--surface-2); }
.opt-main { flex: 1; min-width: 0; }
.opt-sym { font: 600 13px/1.3 var(--mono); }
.opt-nm {
  color: var(--text-faint); font-size: 11px; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
}
.pill {
  font: 700 8.5px/1 var(--sans); text-transform: uppercase; letter-spacing: .05em;
  padding: 3px 5px; border-radius: 4px; flex: 0 0 auto;
}
.pill.native { background: rgba(255, 180, 84, .15); color: var(--amber); }
.pill.hot { background: var(--accent-glow); color: var(--accent); }
.pill.evm { background: var(--surface-3); color: var(--text-dim); }
.opt-usd { font: 11.5px/1 var(--mono); color: var(--text-dim); flex: 0 0 auto; }
.pop-empty { padding: 22px 14px; text-align: center; color: var(--text-faint); font-size: 12.5px; }

/* --- buttons ------------------------------------------------------------- */
.actions {
  display: flex; gap: 9px; flex-wrap: wrap; margin-top: 18px;
  padding-top: 16px; border-top: 1px solid var(--line-soft);
}
.btn {
  height: 38px; padding: 0 15px; border-radius: var(--r-sm);
  border: 1px solid var(--line); background: var(--surface-2);
  color: var(--text); font: 500 13px/1 var(--sans); cursor: pointer;
  display: inline-flex; align-items: center; gap: 7px; transition: all .13s;
}
.btn:hover:not(:disabled) { border-color: var(--surface-3); background: var(--surface-3); }
.btn.primary {
  background: var(--accent); border-color: var(--accent); color: #fff;
  font-weight: 600; box-shadow: 0 2px 10px rgba(76, 141, 255, .28);
}
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn code { font: 12px/1 var(--mono); opacity: .85; }

/* --- note ---------------------------------------------------------------- */
.note {
  margin-top: 13px; font-size: 12.5px; color: var(--text-dim);
  display: flex; gap: 8px; align-items: flex-start;
}
.note svg { flex: 0 0 14px; margin-top: 2px; color: var(--text-faint); }
.note strong { color: var(--text); font-weight: 600; }
.note.bad { color: var(--red); }
.note.bad svg { color: var(--red); }

/* --- results ------------------------------------------------------------- */
.url {
  font: 11px/1.5 var(--mono); color: var(--text-dim); word-break: break-all;
  padding: 9px 11px; background: var(--bg-soft);
  border: 1px solid var(--line-soft); border-radius: var(--r-sm);
  margin-bottom: 16px;
}
.stats {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 14px; margin-bottom: 18px;
}
.stat {
  padding: 11px 13px; background: var(--bg-soft);
  border: 1px solid var(--line-soft); border-radius: var(--r-sm);
}
.stat .k {
  font: 600 9.5px/1 var(--sans); text-transform: uppercase; letter-spacing: .07em;
  color: var(--text-faint); margin-bottom: 6px;
}
.stat .v { font: 16px/1.25 var(--mono); word-break: break-all; }
.stat .v.pos { color: var(--green); }
.stat .v.neg { color: var(--red); }

h2 {
  font: 600 10.5px/1 var(--sans); text-transform: uppercase; letter-spacing: .08em;
  color: var(--text-faint); margin: 0 0 12px;
  display: flex; align-items: center; gap: 9px;
}
.chip {
  font: 600 9.5px/1 var(--sans); text-transform: uppercase; letter-spacing: .05em;
  padding: 4px 7px; border-radius: 5px;
}
.chip.split { background: var(--accent-glow); color: var(--accent); border: 1px solid var(--accent-dim); }
.chip.direct { background: var(--surface-2); color: var(--text-dim); border: 1px solid var(--line); }

.split-row {
  padding: 10px 0 10px 13px; border-left: 2px solid var(--accent-dim); margin-bottom: 10px;
}
.split-head { font: 600 11.5px/1 var(--sans); color: var(--accent); margin-bottom: 7px; }
.bar { height: 3px; background: var(--surface-3); border-radius: 3px; overflow: hidden; margin-bottom: 8px; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), #7d5cff); }
.hop { font: 12px/1.7 var(--mono); color: var(--text-dim); }
.hop .venue { color: var(--green); font-weight: 600; }
.dexlist { font-size: 12px; color: var(--text-dim); margin-top: 10px; }
.dexlist b { color: var(--green); font-weight: 600; }

table { width: 100%; border-collapse: collapse; font: 12px/1 var(--mono); margin-top: 11px; }
th, td { text-align: left; padding: 8px 9px; border-bottom: 1px solid var(--line-soft); }
th {
  font: 600 9.5px/1 var(--sans); text-transform: uppercase; letter-spacing: .06em;
  color: var(--text-faint);
}
td.num { text-align: right; }
tr.best td { color: var(--green); font-weight: 600; }
td.key { color: var(--text-faint); width: 84px; }

pre {
  background: var(--bg-soft); border: 1px solid var(--line-soft);
  border-radius: var(--r-sm); padding: 13px; overflow: auto;
  max-height: 320px; font: 11px/1.6 var(--mono); margin: 0;
}
details { margin-top: 14px; }
summary {
  cursor: pointer; color: var(--text-dim); font-size: 12.5px;
  padding: 8px 0; user-select: none; list-style: none;
  display: flex; align-items: center; gap: 7px;
}
summary::-webkit-details-marker { display: none; }
summary::before {
  content: "\203A"; font-size: 15px; color: var(--text-faint);
  transition: transform .15s; display: inline-block;
}
details[open] > summary::before { transform: rotate(90deg); }
summary:hover { color: var(--text); }

.err {
  background: rgba(255, 95, 86, .08); border: 1px solid rgba(255, 95, 86, .3);
  border-radius: var(--r-sm); padding: 14px; font-size: 13px; color: var(--red);
}
.err strong { display: block; margin-bottom: 7px; font-weight: 600; }
.err code {
  font: 11px/1.5 var(--mono); color: var(--text-dim);
  word-break: break-all; display: block; margin-top: 8px;
}
.loading { display: flex; align-items: center; gap: 10px; color: var(--text-dim); font-size: 13px; }
.spin {
  width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid var(--surface-3); border-top-color: var(--accent);
  animation: sp .6s linear infinite;
}
@keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff"
             stroke-width="2.4" stroke-linecap="round">
          <path d="M3 15c2.5 0 2.5-2.5 5-2.5s2.5 2.5 5 2.5 2.5-2.5 5-2.5 2.5 2.5 3 2.5"/>
          <path d="M3 9c2.5 0 2.5-2.5 5-2.5S10.5 9 13 9s2.5-2.5 5-2.5S20.5 9 21 9" opacity=".5"/>
        </svg>
      </div>
      <h1>OpenOcean Playground</h1>
      <span class="tag-v">v4</span>
    </div>
    <p class="lede">
      <strong>quote</strong> returns price and the per-DEX comparison with no wallet.
      <strong>swap</strong> returns the same route plus signable
      <code>to</code>/<code>data</code>/<code>value</code>, and needs an account.
      Amounts sent are human-readable; amounts returned are base units.
    </p>
  </header>

  <div class="card">
    <div class="field" style="margin-bottom:14px; max-width:340px">
      <label for="chainBtn">Chain</label>
      <div class="pick" id="chainPick">
        <button class="control" id="chainBtn" aria-haspopup="listbox" aria-expanded="false">
          <span class="tk">
            <span class="tk-ico" id="chainIco">&middot;</span>
            <span class="tk-txt">
              <span class="tk-sym" id="chainSym">&mdash;</span>
              <span class="tk-sub" id="chainSub"></span>
            </span>
          </span>
          <svg class="caret" width="11" height="11" viewBox="0 0 12 12" fill="none"
               stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
            <path d="M3 4.5 6 7.5 9 4.5"/>
          </svg>
        </button>
        <div class="pop" id="chainPop">
          <div class="pop-search"><input id="chainQ" placeholder="Search chains&hellip;" autocomplete="off" /></div>
          <div class="pop-list" id="chainList"></div>
        </div>
      </div>
    </div>

    <div class="row swap">
      <div class="field">
        <label for="inBtn">From</label>
        <div class="pick" id="inPick">
          <button class="control" id="inBtn" aria-haspopup="listbox" aria-expanded="false">
            <span class="tk">
              <span class="tk-ico" id="inIco">&middot;</span>
              <span class="tk-txt">
                <span class="tk-sym" id="inSym">&mdash;</span>
                <span class="tk-sub" id="inSub"></span>
              </span>
            </span>
            <svg class="caret" width="11" height="11" viewBox="0 0 12 12" fill="none"
                 stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
              <path d="M3 4.5 6 7.5 9 4.5"/>
            </svg>
          </button>
          <div class="pop" id="inPop">
            <div class="pop-search"><input id="inQ" placeholder="Symbol, name or address&hellip;" autocomplete="off" /></div>
            <div class="pop-list" id="inList"></div>
          </div>
        </div>
      </div>

      <div class="flip-wrap">
        <button class="flip" id="flip" title="Flip direction" aria-label="Flip direction">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 4v13M7 17l-3-3M17 20V7M17 7l3 3"/>
          </svg>
        </button>
      </div>

      <div class="field">
        <label for="outBtn">To</label>
        <div class="pick" id="outPick">
          <button class="control" id="outBtn" aria-haspopup="listbox" aria-expanded="false">
            <span class="tk">
              <span class="tk-ico" id="outIco">&middot;</span>
              <span class="tk-txt">
                <span class="tk-sym" id="outSym">&mdash;</span>
                <span class="tk-sub" id="outSub"></span>
              </span>
            </span>
            <svg class="caret" width="11" height="11" viewBox="0 0 12 12" fill="none"
                 stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
              <path d="M3 4.5 6 7.5 9 4.5"/>
            </svg>
          </button>
          <div class="pop" id="outPop">
            <div class="pop-search"><input id="outQ" placeholder="Symbol, name or address&hellip;" autocomplete="off" /></div>
            <div class="pop-list" id="outList"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="row meta">
      <div class="field">
        <label for="amount">Amount</label>
        <input class="control" id="amount" value="1" inputmode="decimal" />
      </div>
      <div class="field">
        <label for="slippage">Slippage %</label>
        <input class="control" id="slippage" value="1" inputmode="decimal" />
      </div>
      <div class="field">
        <label for="gasPrice">Gas (gwei)</label>
        <input class="control" id="gasPrice" value="3" inputmode="decimal" />
      </div>
    </div>

    <div class="row" style="margin-top:14px">
      <div class="field">
        <label for="account">Account &mdash; required for /swap only</label>
        <input class="control" id="account" placeholder="0x… leave blank to use /quote" />
      </div>
    </div>

    <div class="actions">
      <button class="btn primary" id="btnQuote">Get <code>/quote</code></button>
      <button class="btn" id="btnSwap">Get <code>/swap</code></button>
      <button class="btn" id="btnGas">gasPrice</button>
      <button class="btn" id="btnTokens">tokenList</button>
    </div>

    <div class="note" id="note">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1" stroke-linecap="round"/>
      </svg>
      <span id="noteText">Loading chains…</span>
    </div>
  </div>

  <div id="out"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let CHAINS = [];
let TOKENS = [];
/** code -> logo URL, filled in async by /api/chainIcons after first paint. */
let CHAIN_ICONS = {};
const SEL = { chain: null, in: null, out: null };

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/** base units -> human string; mirrors fromBaseUnits() on the server. */
function fromBase(v, d) {
  try {
    const s = BigInt(v ?? 0).toString();
    if (!d) return s;
    const p = s.padStart(d + 1, "0");
    const frac = p.slice(-d).replace(/0+$/, "");
    return frac ? `${p.slice(0, -d)}.${frac}` : p.slice(0, -d);
  } catch { return String(v); }
}

const short = (a) => (a && a.length > 14 ? `${a.slice(0, 6)}…${a.slice(-4)}` : a || "");
const initials = (s) => (s || "?").slice(0, 3).toUpperCase();

/** Icon markup: real image when the API gave one, else letter fallback. */
function iconHtml(item, cls) {
  const label = esc(initials(item?.symbol || item?.code));
  if (item?.icon) {
    return `<img class="${cls}" src="${esc(item.icon)}" alt="" loading="lazy"
      onerror="this.outerHTML='<span class=\\'${cls}\\'>${label}</span>'" />`;
  }
  return `<span class="${cls}">${label}</span>`;
}

/* ===========================================================================
   One picker component drives the chain selector AND both token slots, so the
   native <select> is gone and all three behave identically — same search, same
   keyboard handling, same visuals. Only the data source and row template vary.
   =========================================================================== */
function makePicker({ key, wrap, getItems, row, groups, onPick }) {
  const el = {
    btn: $(`${key}Btn`), pop: $(`${key}Pop`), q: $(`${key}Q`),
    list: $(`${key}List`), sym: $(`${key}Sym`), sub: $(`${key}Sub`),
  };
  const idOf = (it) => it?.address ?? it?.code ?? "";
  let view = [], cursor = 0, isOpen = false;

  const render = () => {
    view = getItems(el.q.value);
    if (cursor >= view.length) cursor = Math.max(0, view.length - 1);

    if (!view.length) {
      el.list.innerHTML =
        `<div class="pop-empty">No match.<br />Paste a full address to use it anyway.</div>`;
      return;
    }
    let html = "", lastGroup = null;
    view.forEach((it, i) => {
      if (groups) {
        const g = groups(it, el.q.value);
        if (g && g !== lastGroup) {
          html += `<div class="pop-group">${esc(g)}</div>`;
          lastGroup = g;
        }
      }
      html += row(it, i, i === cursor, idOf(it) === idOf(SEL[key]));
    });
    el.list.innerHTML = html;
    el.list.querySelector(".opt.on")?.scrollIntoView({ block: "nearest" });
  };

  const open = () => {
    isOpen = true;
    el.pop.classList.add("open");
    el.btn.classList.add("active");
    el.btn.setAttribute("aria-expanded", "true");
    el.q.value = "";
    cursor = 0;
    render();
    el.q.focus();
  };
  const close = () => {
    isOpen = false;
    el.pop.classList.remove("open");
    el.btn.classList.remove("active");
    el.btn.setAttribute("aria-expanded", "false");
  };

  /** Repaint the trigger. Icon node is replaced, so query it fresh each time. */
  const paint = (it) => {
    const slot = el.btn.querySelector(".tk-ico");
    // Chains carry no icon of their own — it comes from the async lookup.
    const art = it.address ? it : { icon: CHAIN_ICONS[it.code], symbol: it.code };
    if (slot) slot.outerHTML = iconHtml(art, "tk-ico");
    el.sym.textContent = it.symbol ?? it.name ?? "—";
    el.sub.textContent = it.address
      ? short(it.address)
      : `${it.code}${it.evm === false ? " · non-EVM" : it.id ? ` · id ${it.id}` : ""}`;
  };

  const choose = (it) => {
    if (!it) return;
    SEL[key] = it;
    paint(it);
    close();
    onPick?.(it);
  };

  el.btn.addEventListener("click", (e) => { e.preventDefault(); isOpen ? close() : open(); });
  el.q.addEventListener("input", () => { cursor = 0; render(); });
  el.q.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { cursor = Math.min(cursor + 1, view.length - 1); render(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { cursor = Math.max(cursor - 1, 0); render(); e.preventDefault(); }
    else if (e.key === "Enter") { choose(view[cursor]); e.preventDefault(); }
    else if (e.key === "Escape") { close(); el.btn.focus(); e.preventDefault(); }
  });
  el.list.addEventListener("mousedown", (e) => {
    const r = e.target.closest("[data-i]");
    if (!r) return;
    e.preventDefault();
    choose(view[Number(r.dataset.i)]);
  });
  document.addEventListener("click", (e) => {
    if (isOpen && !$(wrap).contains(e.target)) close();
  });

  // `set` selects without firing onPick — used for programmatic defaults/flip.
  return { choose, set: (it) => { if (it) { SEL[key] = it; paint(it); } } };
}

/* --- row templates -------------------------------------------------------- */

const chainRow = (c, i, on, sel) => `
  <div class="opt${on ? " on" : ""}${sel ? " sel" : ""}" data-i="${i}">
    ${iconHtml({ icon: CHAIN_ICONS[c.code], symbol: c.code }, "tk-ico")}
    <span class="opt-main">
      <div class="opt-sym">${esc(c.name)}</div>
      <div class="opt-nm">${esc(c.code)}${c.id ? ` · chain id ${c.id}` : ""}</div>
    </span>
    ${c.evm ? "" : `<span class="pill evm">non-EVM</span>`}
  </div>`;

const tokenRow = (t, i, on, sel) => `
  <div class="opt${on ? " on" : ""}${sel ? " sel" : ""}" data-i="${i}">
    ${iconHtml(t, "tk-ico")}
    <span class="opt-main">
      <div class="opt-sym">${esc(t.symbol)}</div>
      <div class="opt-nm">${esc(t.name || short(t.address))}</div>
    </span>
    ${t.isNative ? `<span class="pill native">native</span>`
      : t.isHot ? `<span class="pill hot">hot</span>` : ""}
    ${t.usd != null ? `<span class="opt-usd">$${esc(String(t.usd))}</span>` : ""}
  </div>`;

/* --- search --------------------------------------------------------------- */

function chainItems(q) {
  const v = q.trim().toLowerCase();
  if (!v) return CHAINS;
  return CHAINS.filter(
    (c) =>
      c.name.toLowerCase().includes(v) ||
      c.code.toLowerCase().includes(v) ||
      String(c.id ?? "").includes(v),
  );
}

/** Rank: address hit, exact symbol, symbol prefix, symbol substring, then name. */
function tokenItems(q) {
  const raw = q.trim();
  const v = raw.toUpperCase();
  if (!v) return TOKENS.slice(0, 80);
  const scored = [];
  for (const t of TOKENS) {
    const s = t.symbol.toUpperCase();
    const n = (t.name || "").toUpperCase();
    let k = -1;
    if (t.address.toLowerCase() === raw.toLowerCase()) k = 0;
    else if (s === v) k = 1;
    else if (s.startsWith(v)) k = 2;
    else if (s.includes(v)) k = 3;
    else if (n.startsWith(v)) k = 4;
    else if (n.includes(v)) k = 5;
    if (k >= 0) scored.push([k, t]);
  }
  scored.sort((a, b) => a[0] - b[0]);
  return scored.slice(0, 80).map((x) => x[1]);
}

/** Group headers only on the unfiltered list, where the split means something. */
const tokenGroups = (t, q) => (q.trim() ? null : t.isNative || t.isHot ? "Popular" : "All tokens");

const pickers = {};

/* --- data loading --------------------------------------------------------- */

function setNote(html, bad) {
  $("noteText").innerHTML = html;
  $("note").classList.toggle("bad", !!bad);
}

async function loadTokensFor(code) {
  TOKENS = [];
  SEL.in = SEL.out = null;
  $("inSym").textContent = $("outSym").textContent = "…";
  $("inSub").textContent = $("outSub").textContent = "";
  setNote(`Loading tokens for <strong>${esc(code)}</strong>…`);

  try {
    const res = await fetch(`/api/tokens?chain=${encodeURIComponent(code)}`);
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || "request failed");
    TOKENS = body.tokens || [];

    const native = TOKENS.find((t) => t.isNative);
    // Prefer USDC/USDT by name rather than taking the top-priced stablecoin —
    // they all sit at ~$1, so price order between them is arbitrary noise.
    const stable = ["USDC", "USDT", "DAI"]
      .map((s) => TOKENS.find((t) => t.symbol.toUpperCase() === s && !t.isNative))
      .find(Boolean);
    const out = stable || TOKENS.find((t) => t.isHot && !t.isNative) || TOKENS[1];
    pickers.in.set(native);
    pickers.out.set(out);

    const hot = TOKENS.filter((t) => t.isHot).length;
    setNote(
      `<strong>${TOKENS.length}</strong> tokens on <strong>${esc(code)}</strong> · ` +
        `${hot} popular · search by symbol, name or address.`,
    );
  } catch (err) {
    setNote(`Could not load tokens: ${esc(err.message || err)}`, true);
  }
}

async function boot() {
  pickers.chain = makePicker({
    key: "chain", wrap: "chainPick",
    getItems: chainItems, row: chainRow,
    onPick: (c) => loadTokensFor(c.code),
  });
  pickers.in = makePicker({
    key: "in", wrap: "inPick",
    getItems: tokenItems, row: tokenRow, groups: tokenGroups,
  });
  pickers.out = makePicker({
    key: "out", wrap: "outPick",
    getItems: tokenItems, row: tokenRow, groups: tokenGroups,
  });

  try {
    CHAINS = await (await fetch("/api/chains")).json();
  } catch {
    setNote("Could not reach the local server — is <strong>bun run dev</strong> running?", true);
    return;
  }
  $("chainQ").placeholder = `Search ${CHAINS.length} chains…`;
  const start = CHAINS.find((c) => c.code === "bsc") || CHAINS[0];
  pickers.chain.set(start);

  // Chain logos need a token list per chain, so fetch them alongside the first
  // token load rather than blocking the page. Initials show until they land.
  const icons = fetch("/api/chainIcons")
    .then((r) => (r.ok ? r.json() : {}))
    .then((map) => {
      CHAIN_ICONS = map || {};
      if (SEL.chain) pickers.chain.set(SEL.chain); // upgrade the trigger
    })
    .catch(() => {});

  await Promise.all([loadTokensFor(start.code), icons]);
}

/* --- API calls ------------------------------------------------------------ */

function params(withAccount) {
  const p = new URLSearchParams({
    chain: SEL.chain?.code ?? "bsc",
    in: SEL.in?.address ?? "",
    out: SEL.out?.address ?? "",
    amount: $("amount").value.trim(),
    slippage: $("slippage").value.trim(),
    gasPrice: $("gasPrice").value.trim(),
  });
  if (withAccount) p.set("account", $("account").value.trim());
  return p;
}

function renderRoute(a) {
  if (!a?.hops?.length) {
    return `<div class="hop" style="color:var(--text-faint)">No nested path returned — typically a direct single-pool swap.</div>`;
  }
  const bySplit = {};
  for (const h of a.hops) (bySplit[h.routeIndex] ??= []).push(h);

  return Object.entries(bySplit)
    .map(([idx, hops]) => {
      const pct = hops[0].routePercentage ?? 100;
      const rows = hops
        .map((h) => {
          const venues = h.venues
            .map((v) => `<span class="venue">${esc(v.dex)}${v.percentage < 100 ? ` ${v.percentage}%` : ""}</span>`)
            .join(" + ");
          return `<div class="hop">${h.hopIndex + 1}. ${short(h.from)} → ${short(h.to)} · ${venues}</div>`;
        })
        .join("");
      return `<div class="split-row">
        <div class="split-head">Split ${Number(idx) + 1} — ${pct}% of input</div>
        <div class="bar"><i style="width:${Math.min(100, pct)}%"></i></div>${rows}
      </div>`;
    })
    .join("");
}

function renderDexTable(d) {
  const list = (d.dexes ?? []).filter((x) => !x.error && x.swapAmount && x.swapAmount !== "0");
  if (!list.length) return "";
  const dec = d.outToken?.decimals ?? 18;
  const best = list.reduce((a, b) => (BigInt(b.swapAmount) > BigInt(a.swapAmount) ? b : a));
  const sorted = [...list].sort((a, b) => (BigInt(b.swapAmount) > BigInt(a.swapAmount) ? 1 : -1));
  return `
    <details open>
      <summary>Per-DEX quotes — ${sorted.length} venues, what each gives alone</summary>
      <table>
        <thead><tr><th>Venue</th><th class="num">Out (${esc(d.outToken?.symbol ?? "")})</th></tr></thead>
        <tbody>${sorted
          .slice(0, 18)
          .map(
            (x) => `<tr class="${x.dexCode === best.dexCode ? "best" : ""}">
            <td>${esc(x.dexCode)}${x.dexCode === best.dexCode ? " ★" : ""}</td>
            <td class="num">${fromBase(x.swapAmount, dec)}</td></tr>`,
          )
          .join("")}</tbody>
      </table>
    </details>`;
}

async function call(endpoint, withAccount) {
  const out = $("out");
  out.innerHTML = `<div class="card"><div class="loading"><span class="spin"></span>Calling ${esc(endpoint)}…</div></div>`;

  try {
    const res = await fetch(`/api/${endpoint}?${params(withAccount)}`);
    const body = await res.json();

    if (!res.ok) {
      out.innerHTML = `<div class="card"><div class="err">
        <strong>${esc(body.error ?? "Request failed")}</strong>
        ${body.body ? `<code>${esc(JSON.stringify(body.body).slice(0, 400))}</code>` : ""}
      </div></div>`;
      return;
    }

    if (endpoint === "gasPrice" || endpoint === "tokens") {
      out.innerHTML = `<div class="card">
        <div class="url">${esc(body.url ?? "")}</div>
        ${body.count !== undefined
          ? `<div class="stats"><div class="stat"><div class="k">tokens</div><div class="v">${body.count}</div></div></div>`
          : ""}
        <pre>${esc(JSON.stringify(body.tokens?.slice(0, 30) ?? body.data, null, 2))}</pre>
      </div>`;
      return;
    }

    const d = body.data;
    const a = d._analysis ?? {};
    const inD = d.inToken?.decimals ?? 18;
    const outD = d.outToken?.decimals ?? 18;
    const imp = parseFloat(d.price_impact);

    out.innerHTML = `
      <div class="card">
        <div class="url">${esc(body.url)}</div>
        <div class="stats">
          <div class="stat"><div class="k">In</div><div class="v">${fromBase(d.inAmount, inD)} ${esc(d.inToken?.symbol ?? "")}</div></div>
          <div class="stat"><div class="k">Out</div><div class="v">${fromBase(d.outAmount, outD)} ${esc(d.outToken?.symbol ?? "")}</div></div>
          ${d.price_impact
            ? `<div class="stat"><div class="k">Price impact</div><div class="v ${imp < 0 ? "neg" : "pos"}">${esc(d.price_impact)}</div></div>`
            : ""}
          <div class="stat"><div class="k">Est. gas</div><div class="v">${esc(String(d.estimatedGas ?? "—"))}</div></div>
        </div>

        <h2>Route <span class="chip ${a.isSplitRoute ? "split" : "direct"}">${a.isSplitRoute ? "split" : "direct"}</span></h2>
        ${renderRoute(a)}
        ${a.dexesUsed?.length ? `<div class="dexlist">Venues: <b>${esc(a.dexesUsed.join(", "))}</b></div>` : ""}

        ${a.advantage
          ? `<div class="note" style="margin-top:15px">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 17l6-6 4 4 7-7" stroke-linecap="round"/>
              </svg>
              <span>Best single venue (<strong>${esc(a.advantage.bestSingleDex)}</strong>) gives
              ${a.advantage.bestSingleOut} — aggregated route gives
              <strong>${a.advantage.aggregatedOut}</strong>,
              <strong style="color:${a.advantage.improvementPct >= 0 ? "var(--green)" : "var(--red)"}">
              ${a.advantage.improvementPct >= 0 ? "+" : ""}${a.advantage.improvementPct}%</strong>.</span>
            </div>`
          : ""}

        ${renderDexTable(d)}

        ${d.data
          ? `<details open>
              <summary>Transaction — ready to sign</summary>
              <table>
                <tr><td class="key">to</td><td>${esc(d.to ?? "")}</td></tr>
                <tr><td class="key">value</td><td>${esc(d.value ?? "0")}</td></tr>
                <tr><td class="key">gasPrice</td><td>${esc(d.gasPrice ?? "")}</td></tr>
                <tr><td class="key">data</td><td style="word-break:break-all">${esc((d.data ?? "").slice(0, 180))}…</td></tr>
              </table>
            </details>`
          : ""}

        <details><summary>Raw JSON</summary><pre>${esc(JSON.stringify(d, null, 2))}</pre></details>
      </div>`;
  } catch (err) {
    out.innerHTML = `<div class="card"><div class="err"><strong>${esc(String(err))}</strong></div></div>`;
  }
}

$("btnQuote").onclick = () => call("quote", false);
$("btnSwap").onclick = () => call("swap", true);
$("btnGas").onclick = () => call("gasPrice", false);
$("btnTokens").onclick = () => call("tokens", false);
$("flip").onclick = () => {
  const a = SEL.in, b = SEL.out;
  if (a && b) { pickers.in.set(b); pickers.out.set(a); }
};

boot();
</script>
</body>
</html>
